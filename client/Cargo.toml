[package]
name = "interop-client"
version = "0.1.0"
edition = "2021"

[dependencies]
interop-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "macros", "signal", "sync"] }
bytes = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
